# Base de datos local de desarrollo. Los secretos vienen del entorno (no hay .env en el repo).
# Uso: export POSTGRES_PASSWORD=... AGENT_RO_PASSWORD=... && docker compose up -d db
services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: incident_room
      POSTGRES_USER: incident_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?exportá POSTGRES_PASSWORD}
      AGENT_RO_PASSWORD: ${AGENT_RO_PASSWORD:?exportá AGENT_RO_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Los scripts de este directorio corren solo al inicializar un volumen vacío.
      - ./db/dev/init-agent-ro.sh:/docker-entrypoint-initdb.d/10-agent-ro.sh:ro
      - ./db/dev/agent-readonly.sql:/db/agent-readonly.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U incident_owner -d incident_room"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
